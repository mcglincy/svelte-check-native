name: manapool-package

on:
  push:
    branches: [codex/manapool-package]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: win32-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.platform == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Unit tests and emit snapshots
        if: matrix.platform == 'linux-x64'
        run: |
          cargo test --locked --workspace --lib
          cargo test --locked --test emit_snapshots
      - name: Build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release -p svelte-check-native
      - name: Package
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          node scripts/prepare-manapool-release.mjs
          binary=svelte-check-native
          if [[ "$PACKAGE_PLATFORM" == win32-* ]]; then binary="$binary.exe"; fi
          dest="dist-packs/pkgs/svelte-check-native-$PACKAGE_PLATFORM/bin"
          mkdir -p "$dest"
          cp "target/$RUST_TARGET/release/$binary" "$dest/$binary"
          chmod +x "$dest/$binary"
          npm pack "./dist-packs/pkgs/svelte-check-native-$PACKAGE_PLATFORM" --pack-destination dist-packs
          npm pack ./dist-packs/pkgs/svelte-check-native --pack-destination dist-packs
      - name: Smoke installed package
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir smoke
          cd smoke
          npm init -y
          npm install --ignore-scripts ../dist-packs/manapoolinc-svelte-check-native-1*.tgz "../dist-packs/manapoolinc-svelte-check-native-$PACKAGE_PLATFORM-"*.tgz
          node node_modules/@manapoolinc/svelte-check-native/bin/svelte-check-native.js --version
          node node_modules/@manapoolinc/svelte-check-native/bin/svelte-check-native.js --tsgo-version | tee compiler-version.txt
          grep -F '7.1.0-dev.20261113.1' compiler-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist-packs/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'manapoolinc/svelte-check-native' && github.ref == 'refs/heads/codex/manapool-package'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist-packs
          merge-multiple: true
      - name: Extract tested packages
        run: |
          node scripts/prepare-manapool-release.mjs
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            tar -xzf dist-packs/manapoolinc-svelte-check-native-$platform-*.tgz --strip-components=1 -C "dist-packs/pkgs/svelte-check-native-$platform"
          done
          tar -xzf dist-packs/manapoolinc-svelte-check-native-1*.tgz --strip-components=1 -C dist-packs/pkgs/svelte-check-native
      - name: Publish platforms then wrapper
        run: node scripts/publish-all.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
